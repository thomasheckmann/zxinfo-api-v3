version: "3"

services:
  zxinfo-es:
    image: "blacktop/elasticsearch:7.9"
    ports:
      - "127.0.0.1:9200:9200"
      - "127.0.0.1:9300:9300"
    expose:
      - "9200"
      - "9300"
    networks:
      - zxinfo_net
      
  zxinfo-api-v3:
    build:
      context: ../zxinfo-api-v3
      dockerfile: Dockerfile
    environment:
      NODE_ENV: container
    ports:
      - "127.0.0.1:8300:3000"
    expose:
      - "8300"
    links:
      - zxinfo-es
    depends_on:
      - zxinfo-es
   

